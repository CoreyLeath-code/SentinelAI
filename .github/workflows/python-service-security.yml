name: Python Service Dependency Security

on:
  push:
    branches: [main]
    paths:
      - "llm-guard/**"
      - "drift-engine/**"
      - "streamlit-dashboard/**"
      - ".github/workflows/python-service-security.yml"
  pull_request:
    branches: [main]
    paths:
      - "llm-guard/**"
      - "drift-engine/**"
      - "streamlit-dashboard/**"
      - ".github/workflows/python-service-security.yml"

permissions:
  contents: read

jobs:
  audit-services:
    name: Audit ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - llm-guard
          - drift-engine
          - streamlit-dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit resolved service dependencies
        run: python -m pip_audit -r "${{ matrix.service }}/requirements.txt"

      - name: Check service Python syntax
        run: python -m compileall -q "${{ matrix.service }}"
